[package]
name = "payload_extract_jni"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Independent Android JNI bridge for bounded-parallel Android OTA payload extraction"

[lib]
name = "payload_extract_jni"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
async-compression = { version = "0.4", features = ["tokio", "xz", "bzip2", "zstd"] }
futures-util = "0.3"
jni = "0.21.1"
payload_dumper = { version = "0.8.4", default-features = false, features = ["local_zip"] }
sha2 = "0.11"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
